name: Bootstrapper CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-installer:
    name: Validate PowerShell Bootstrapper
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Parse PowerShell Script Syntax
        shell: pwsh
        run: |
          $scriptPath = (Resolve-Path "install.ps1").Path
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            Write-Error "Syntax errors detected in $scriptPath:"
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 AST syntax parsed successfully with 0 errors." -ForegroundColor Green

      - name: Run PSScriptAnalyzer Linting
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error, Warning
          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object { $_.Severity -eq "Error" }
            if ($errors) {
              Write-Error "PSScriptAnalyzer detected critical errors!"
              exit 1
            }
          }
          Write-Host "PSScriptAnalyzer analysis passed." -ForegroundColor Green

      - name: Test Parameter Handling & Dry-Run
        shell: pwsh
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP "dg_test_$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          
          # Create mock staging executable with PE magic header 'MZ'
          $mockExe = Join-Path $tempDir "mock_dg.exe"
          $peBytes = [byte[]]@(0x4D, 0x5A, 0x90, 0x00, 0x03, 0x00)
          [System.IO.File]::WriteAllBytes($mockExe, $peBytes)
          
          # Create corresponding SHA256SUMS.txt
          $mockHash = (Get-FileHash $mockExe -Algorithm SHA256).Hash
          "$mockHash  dg.exe" | Set-Content (Join-Path $tempDir "SHA256SUMS.txt")
          
          # Test local staging path with isolated install directory and skipped registry writes
          $installTarget = Join-Path $tempDir "install_bin"
          .\install.ps1 -UseLocalStaging -LocalSource $mockExe -InstallDir $installTarget -SkipPathRegistration
          
          $target = Join-Path $installTarget "dg.exe"
          if (!(Test-Path $target)) {
            Write-Error "Bootstrapper failed to deploy binary to target directory!"
            exit 1
          }
          
          Write-Host "Bootstrapper staging flow successfully verified in isolated CI sandbox." -ForegroundColor Green
          Remove-Item -Recurse -Force $tempDir

  validate-docs:
    name: Validate Documentation Integrity
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Markdown References
        shell: pwsh
        run: |
          $docFiles = @("README.md", "docs/INSTALLATION.md")
          foreach ($file in $docFiles) {
            if (!(Test-Path $file)) {
              Write-Error "Required documentation file missing: $file"
              exit 1
            }
            $content = Get-Content $file -Raw
            if ($content -notmatch "https://arvindvincenzo.com/daemonsgate") {
              Write-Error "Documentation file $file does not contain canonical product website link!"
              exit 1
            }
          }
          Write-Host "All documentation files present with canonical website links verified." -ForegroundColor Green
